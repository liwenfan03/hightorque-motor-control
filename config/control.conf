# Defaults for `motor_tool control` (position / velocity / torque / impedance).
#
# Lookup order for every parameter, first match wins:
#   1. the command line: --key value  (one value = all motors, or one per --id entry)
#   2. [<mode>.<id>]   e.g. [position.2]  = position mode, motor ID 2
#   3. [<mode>]        e.g. [position]
#   4. [common.<id>]   e.g. [common.1]
#   5. [common]
#   6. the built-in default (motor_tool control prints the values it uses)
# Keys are the command-line option names without "--".  Lines starting with # are comments.
# Another file: --config PATH.  Unknown keys are an error (typo protection).

# Motor model per ID (torque correction factor k).  --model on the command line overrides.
[motors]
1 = M4438_32
2 = M5047_36

[common]
rate = 1000           # control loop Hz
pipeline = 1          # 1: pipelined, fixed-interval sends (default, all modes); 0: send -> wait -> send (--sequential)
duration = 10         # s, 0 = until Ctrl-C
ramp = 1              # s, setpoint amplitude fades in / out
safe-vel = 0.5        # r/s, any motor faster -> stop all (0 = OFF, not recommended)
max-start-deg = 10    # deg, position / impedance refuse to start farther from the first setpoint
max-missed = 3        # stale cycles (no reply in time) in a row on one motor -> stop all
brake = 0.5           # s: at the end, on Ctrl-C and on every safety stop: BRAKE (shorted phases) until slow, then
                      # stop (free). A plain stop lets the low-friction 4438 coast on. 0 = stop only
resend-every = 1      # position / velocity: 1 = send every register every cycle (SAFE).  N > 1 = unchanged
                      # registers only every N cycles (32 -> 16 byte) - but vel-max / acc then seem NOT to
                      # act in the frames without them (30 deg step ran at full speed): do not use for now
freq = 0.5            # Hz, sine / square

# 位置模式 (mode 10) registers.  A key that is left out (or commented out) is not sent: the motor
# uses its firmware default.  Only vel-max + acc = vendor case 7; none = case 2.
#   vel        0x021 velocity / feed-forward velocity   r/s
#   tqe        0x022 feed-forward torque                Nm
#   kp-scale   0x023 scale of the firmware kp           0..1
#   kd-scale   0x024 scale of the firmware kd           0..1
#   max-tqe    0x025 max torque                         Nm
#   stop-pos   0x026 stop position (from the zero)      deg
#   vel-max    0x028 velocity limit                     r/s
#   acc        0x029 acceleration limit                 r/s^2
[position]
shape = host          # --pipeline: vel-max / acc applied on the host (not sent: shorter frames); motor = sent every frame
safe-vel = 2.0        # r/s, stop all above (the motor's planner limits the speed with vel-max / acc; 0 = OFF)
vel-max = 0.3
acc = 1.0
max-tqe = 1.0
# kp-scale = 1
# kd-scale = 1
# tqe = 0

[velocity]
vel-ramp = 1.0        # r/s^2, host acceleration limit; also the braking deceleration before the limits
max-tqe = 1.0
# acc = 1.0           # 0x029: the motor's own acceleration limit (on top of the host ramp)

[torque]
max-tqe = 0.5         # Nm, host clamp of the torque command
kd = 0.2              # Nm/(turn/s), damping added to the torque command (0 = pure torque)

[impedance]
max-tqe = 0.3         # Nm, host clamp
gain-ramp = 1         # s, kp / kd ramp up from 0
kp = 0                # Nm/turn  (set on the command line)
kd = 0                # Nm/(turn/s)

# Example: allow more torque for the 5047 (higher static friction, README "Impedance").
[impedance.2]
max-tqe = 0.5
